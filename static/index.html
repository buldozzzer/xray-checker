<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xray Checker</title>
<script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<style>
:root {
  --bg: #0d1017; --panel: #151a24; --cell: #181e2a; --border: #262e3e;
  --text: #e6e9ef; --muted: #8a93a6; --accent: #ffcc00;
  --good: #2fbf71; --mid: #e5b72e; --slow: #e8803a; --bad: #e5484d; --idle: #3a4356;
  --accent-t: var(--accent); --on-accent: #111; --header-bg: rgba(13,16,23,.95); --cell-hover: #1d2433;
  --shadow: rgba(0,0,0,.55); --backdrop: rgba(0,0,0,.6); --err-bg: #3a1418; --mini-bg: #222a39; --flag-ring: rgba(255,255,255,.12);
  --good-t: #7fe0a9; --mid-t: #f0d27a; --slow-t: #f4ac7c; --bad-t: #f3878a;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #dfe9f5; --panel: #eef4fb; --cell: #f0f6fc; --border: #c3d3e6;
  --text: #172235; --muted: #55657c; --accent: #f5c000; --accent-t: #9a7400;
  --good: #1f9d57; --mid: #c99a12; --slow: #d56a22; --bad: #d73a40; --idle: #b4c6dc;
  --header-bg: rgba(223,233,245,.95); --cell-hover: #f7fbff; --shadow: rgba(30,40,60,.18); --backdrop: rgba(20,25,35,.35);
  --err-bg: #fde8e9; --mini-bg: #dde8f4; --flag-ring: rgba(0,0,0,.15);
  --good-t: #157a42; --mid-t: #8a6a00; --slow-t: #a8501a; --bad-t: #b3262c;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--header-bg); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
h1 span { color: var(--accent-t); }
.tabs { display: flex; gap: 4px; background: var(--panel); padding: 3px; border-radius: 8px; border: 1px solid var(--border); flex-wrap: wrap; }
.tabs button { background: none; border: 0; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
.tabs button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 7px 12px;
  border-radius: 7px; cursor: pointer; font: inherit; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.bar { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; color: var(--muted); font-size: 13px; }
.bar b { color: var(--text); }
.bar select, .bar input { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font: inherit; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin: 0 4px 0 10px; vertical-align: -1px; }
.err { margin: 0 16px 10px; padding: 10px 12px; background: var(--err-bg); border: 1px solid var(--bad); border-radius: 8px; display: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; padding: 6px 16px 24px; }
.cell { background: var(--cell); border: 1px solid var(--border); border-left: 4px solid var(--idle);
  border-radius: 8px; padding: 9px 10px 8px; cursor: pointer; position: relative; min-width: 0;
  transition: transform .18s ease, box-shadow .18s ease, border-color .15s; }
.cell:hover { border-color: var(--accent); }
@media (hover: hover) {
  .cell:hover { transform: scale(1.12); z-index: 3; background: var(--cell-hover); box-shadow: 0 10px 30px var(--shadow); }
}
@media (prefers-reduced-motion: reduce) { .cell { transition: none; } }
.cell.good { border-left-color: var(--good); } .cell.mid { border-left-color: var(--mid); }
.cell.slow { border-left-color: var(--slow); } .cell.bad { border-left-color: var(--bad); }
.cell.run { border-left-color: var(--accent); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px; }
.star { position: absolute; top: 6px; right: 7px; background: none; border: 0; padding: 0; cursor: pointer;
  font-size: 15px; line-height: 1; color: var(--idle); }
.star:hover { color: var(--accent-t); }
.star.on { color: var(--accent-t); }
.hist { position: absolute; top: 6px; right: 26px; background: none; border: 0; padding: 0; cursor: pointer;
  font-size: 13px; line-height: 1; color: var(--muted); }
.hist:hover { color: var(--accent-t); }
.name { padding-right: 38px; }
.strip { display: flex; gap: 1px; height: 6px; margin-top: 5px; }
.strip i { flex: 1; max-width: 6px; border-radius: 1px; background: var(--bad); }
.strip i.ok { background: var(--good); }
#histDlg { width: min(760px, calc(100vw - 32px)); }
.htable { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.htable th, .htable td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.htable th { color: var(--muted); font-weight: 500; }
.htable td.ok { color: var(--good-t); } .htable td.bad { color: var(--bad-t); }
.hscroll { max-height: 50vh; overflow: auto; margin-top: 12px; }
.hbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; color: var(--muted); font-size: 13px; }
.hbar select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font: inherit; }
.name .fi { margin-right: 6px; border-radius: 2px; box-shadow: 0 0 0 1px var(--flag-ring); }
.proto { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proto .p { color: var(--accent-t); text-transform: uppercase; font-weight: 600; }
.val { font-size: 20px; font-weight: 700; margin: 6px 0 2px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.val small { font-size: 12px; color: var(--muted); font-weight: 500; }
.val.e { font-size: 14px; color: var(--bad); }
.minis { display: flex; gap: 4px; margin-top: 4px; }
.mini { flex: 1; font-size: 10px; text-align: center; padding: 2px 0; border-radius: 4px; background: var(--mini-bg); color: var(--muted);
  white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
.mini.good { background: rgba(47,191,113,.18); color: var(--good-t); } .mini.mid { background: rgba(229,183,46,.18); color: var(--mid-t); }
.mini.slow { background: rgba(232,128,58,.18); color: var(--slow-t); } .mini.bad { background: rgba(229,72,77,.2); color: var(--bad-t); }
.mini.run { color: var(--accent-t); }
.mini.sel { outline: 1px solid var(--accent); }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
  width: min(560px, calc(100vw - 32px)); }
dialog::backdrop { background: var(--backdrop); }
dialog h2 { font-size: 15px; margin: 0 0 10px; }
dialog textarea { width: 100%; height: 50vh; background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px; font: 13px/1.5 ui-monospace, monospace; resize: vertical; }
dialog .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
/* list view: same cells laid out as table rows */
.grid.list, .lhead { --cols: 18px 18px minmax(170px, 1.6fr) minmax(150px, 1.3fr) minmax(130px, 1fr) minmax(170px, 1.2fr) minmax(90px, 140px); }
.grid.list { grid-template-columns: 1fr; gap: 4px; padding-top: 0; }
.grid.list .cell, .lhead { display: grid; grid-template-columns: var(--cols); gap: 10px; align-items: center; padding: 6px 10px; }
.grid.list .hist, .grid.list .star { position: static; }
.grid.list .name, .grid.list .proto, .grid.list .val, .grid.list .minis, .grid.list .strip { margin: 0; padding-right: 0; }
.grid.list .val { font-size: 15px; }
.grid.list .strip { height: 8px; }
.lhead { display: none; margin: 0 16px 4px; border-left: 4px solid transparent; color: var(--muted); font-size: 12px; }
.lhead.on { display: grid; }
.lhead .mh { display: flex; gap: 4px; } .lhead .mh span { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) { .grid.list .cell:hover { transform: scale(1.015); } }
.view { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; vertical-align: middle; }
.view button { background: var(--panel); color: var(--muted); border: 0; padding: 4px 10px; cursor: pointer; font: inherit; }
.view button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
@media (max-width: 760px) {
  .grid.list, .lhead { --cols: 18px 18px minmax(0, 1fr) 110px; }
  .grid.list .proto, .grid.list .minis, .grid.list .strip, .lhead .hp, .lhead .mh, .lhead .hs { display: none; }
}
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 6px 10px 20px; } header, .bar { padding-left: 10px; padding-right: 10px; } }
</style>
</head>
<body>
<header>
  <h1><span>⬢</span> Xray Checker</h1>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <button class="btn primary" id="runSel">Проверить</button>
  <button class="btn" id="runAll">Все цели</button>
  <button class="btn" id="reload">Обновить подписку</button>
  <button class="btn" id="report">Сформировать отчёт</button>
  <button class="btn" id="exportMd" title="Серверы с текущими фильтрами — в Markdown для Telegram">Экспорт MD</button>
  <button class="btn" id="theme" title="Светлая / тёмная тема"></button>
</header>
<dialog id="reportDlg">
  <h2 id="reportTitle"></h2>
  <div class="hbar" id="mdType" hidden>Выгрузить <span class="view"><button data-t="">все</button><button data-t="ok">✓ рабочие</button><button data-t="bad">✕ нерабочие</button></span></div>
  <textarea id="reportText" readonly></textarea>
  <div class="acts"><button class="btn" id="reportSave" hidden>Скачать .md</button><button class="btn" id="reportCopy">Копировать</button><button class="btn primary" id="reportClose">Закрыть</button></div>
</dialog>
<div class="bar">
  <span class="view" id="view"><button data-v="grid" title="Матрица">▦ Матрица</button><button data-v="list" title="Список">☰ Список</button></span>
  <span id="summary"></span>
  <span class="view" id="fStatus"><button data-s="" title="Все серверы">все</button><button data-s="ok" title="Последняя проверка выбранной цели успешна">✓ рабочие</button><button data-s="bad" title="Последняя проверка выбранной цели неуспешна">✕ нерабочие</button><button data-s="none" title="Ещё не проверены или проверяются сейчас">не проверены</button></span>
  <span>Протокол <select id="fProto"><option value="">все</option></select></span>
  <span>Поиск <input id="fText" placeholder="имя / адрес" size="14"></span>
  <label><input type="checkbox" id="fWatched"> только ★</label>
  <span id="watchInfo"></span>
  <span>Сортировка <select id="sort"><option value="">как в подписке</option><option value="val">по задержке</option><option value="name">по имени</option></select></span>
  <span class="legend"><i style="background:var(--good)"></i>быстро<i style="background:var(--mid)"></i>норм<i style="background:var(--slow)"></i>медленно<i style="background:var(--bad)"></i>недоступен</span>
</div>
<dialog id="histDlg">
  <h2 id="histTitle"></h2>
  <div class="hbar">Доступность (успешных проверок)</div>
  <div id="histUptime"></div>
  <div id="histChart"></div>
  <div class="hbar" style="margin-top:14px">Проверки
    <select id="histTarget"><option value="">все цели</option></select>
    <select id="histDays"><option value="1">24 ч</option><option value="7">7 дней</option><option value="30" selected>30 дней</option><option value="90">90 дней</option></select>
  </div>
  <div class="hscroll" id="histChecks"></div>
  <div class="acts"><button class="btn primary" id="histClose">Закрыть</button></div>
</dialog>
<div class="err" id="err"></div>
<div class="lhead" id="lhead"></div>
<div class="grid" id="grid"></div>

<script>
const $ = s => document.querySelector(s);
const cells = new Map();
let S = null, shown = [], mdType = '', target = localStorage.getItem('target') || 'cloudflare';
let view = localStorage.getItem('view') === 'list' ? 'list' : 'grid';
let status = localStorage.getItem('status') || '';
// status of a node for the selected target: ok / bad / none (not checked yet or in progress)
const nodeStatus = r => !r || r.state !== 'done' ? 'none' : r.ok ? 'ok' : 'bad';

// thresholds in ms (latency, ping) or Mbit/s (download)
const grade = (key, r) => {
  if (!r || r.state !== 'done') return r && r.state ? 'run' : '';
  if (!r.ok) return 'bad';
  const kind = S.targets[key].kind;
  if (kind === 'download') return r.mbps >= 20 ? 'good' : r.mbps >= 5 ? 'mid' : 'slow';
  if (kind === 'ping') return r.ms >= 300 || r.loss >= 50 ? 'slow' : r.ms >= 100 || r.loss > 0 ? 'mid' : 'good';
  return r.ms < 500 ? 'good' : r.ms < 1500 ? 'mid' : 'slow';
};
const fmt = ms => ms >= 10000 ? (ms / 1000).toFixed(1) + ' s' : ms + ' ms';
function mainVal(key, r) {
  if (!r) return '<div class="val"><small>—</small></div>';
  if (r.state === 'queued') return '<div class="val"><small>в очереди…</small></div>';
  if (r.state === 'running') return `<div class="val"><small>проверка ${Math.round(Date.now()/1000 - r.started)}s…</small></div>`;
  if (!r.ok) return `<div class="val e">✕ ${esc(r.error || 'ошибка')}</div>`;
  const kind = S.targets[key].kind;
  if (kind === 'download') return `<div class="val">${r.mbps} <small>Mbit/s · ${fmt(r.ms)}</small></div>`;
  if (kind === 'ping') return `<div class="val">${fmt(r.ms)} <small>${r.method} ${r.min_ms}–${r.max_ms}${r.loss ? ` · потери ${r.loss}%` : ''}</small></div>`;
  if (kind === 'ip') return `<div class="val">${fmt(r.ms)} <small>${esc(r.ip)}</small></div>`;
  return `<div class="val">${fmt(r.ms)} <small>ttfb ${r.ttfb_ms}</small></div>`;
}
function miniVal(key, r) {
  if (!r) return '·';
  if (r.state !== 'done') return '…';
  if (!r.ok) return '✕';
  return S.targets[key].kind === 'download' ? r.mbps + 'M' : r.ms;
}
// leading emoji flag (pair of regional indicators) -> ISO code; rendered as SVG since Windows has no flag emoji
function splitFlag(name) {
  const m = /^\s*([\u{1F1E6}-\u{1F1FF}]{2})\s*/u.exec(name);
  if (!m) return { cc: '', rest: name };
  const cc = [...m[1]].map(c => String.fromCharCode(c.codePointAt(0) - 0x1F1E6 + 97)).join('');
  return { cc, rest: name.slice(m[0].length) };
}
function nameHtml(name) {
  const { cc, rest } = splitFlag(name);
  return (cc ? `<span class="fi fi-${cc}" title="${cc.toUpperCase()}"></span>` : '') + esc(rest);
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function title(n) {
  const lines = [n.name, `${n.protocol} · ${n.network} · ${n.security}`, `${n.address}:${n.port}`, `local proxy 127.0.0.1:${n.port_local}`];
  for (const k in S.targets) {
    const r = S.results[k][n.id];
    if (r && r.state === 'done' && S.targets[k].kind === 'ping') lines.push(`${S.targets[k].label} (${r.method}): ` + (r.ok
      ? `${r.ms} ms (min ${r.min_ms}, max ${r.max_ms}, ${r.recv}/${r.sent}, потери ${r.loss}%)` : `${r.error}${r.detail ? ' — ' + r.detail : ''}`));
    else if (r && r.state === 'done') lines.push(`${S.targets[k].label}: ` + (r.ok ? `${r.ms} ms (ttfb ${r.ttfb_ms}, HTTP ${r.status}, ${r.bytes} B)${r.ip ? ' ' + r.ip : ''}` : `${r.error}${r.detail ? ' — ' + r.detail : ''}`));
  }
  const ts = Math.max(0, ...Object.keys(S.targets).map(k => S.results[k][n.id]?.ts || 0));
  if (ts) lines.push('Проверено: ' + new Date(ts * 1000).toLocaleString());
  if (n.error) lines.push('xray: ' + n.error);
  return lines.join('\n') + '\n\nКлик — перепроверить';
}

function strip(bits) {
  if (!bits) return '';
  return `<div class="strip" title="Последние проверки: ${[...bits].filter(b => b === '1').length} из ${bits.length} успешны">` +
    [...bits].map(b => `<i class="${b === '1' ? 'ok' : ''}"></i>`).join('') + '</div>';
}

let histName = null;
async function openHistory(name) {
  histName = name;
  const ht = $('#histTarget');
  if (ht.options.length === 1) ht.innerHTML += Object.entries(S.targets).map(([k, t]) => `<option value="${k}">${esc(t.label)}</option>`).join('');
  $('#histTitle').innerHTML = nameHtml(name);
  if (!$('#histDlg').open) $('#histDlg').showModal();
  await loadHistory();
}
async function loadHistory() {
  const H = await (await fetch(`/api/history?name=${encodeURIComponent(histName)}&days=${$('#histDays').value}`)).json();
  const pct = u => u ? `${(100 * u.ok / u.total).toFixed(1)}% <small style="color:var(--muted)">(${u.ok}/${u.total})</small>` : '—';
  const targets = Object.keys(S.targets).filter(k => H.uptime[k]);
  $('#histUptime').innerHTML = targets.length ? `<table class="htable"><tr><th>Цель</th><th>24 ч</th><th>7 дней</th><th>30 дней</th></tr>` +
    targets.map(k => `<tr><td>${esc(S.targets[k].label)}</td><td>${pct(H.uptime[k]['24h'])}</td><td>${pct(H.uptime[k]['7d'])}</td><td>${pct(H.uptime[k]['30d'])}</td></tr>`).join('') +
    '</table>' : '<div style="color:var(--muted)">Проверок за 30 дней нет</div>';
  const tf = $('#histTarget').value;
  const src = { manual: 'вручную', watch: 'фон ★', auto: 'авто' };
  const rows = H.checks.filter(c => !tf || c.target === tf);
  $('#histChart').innerHTML = pingChart(H.checks.filter(c => S.targets[c.target]?.kind === 'ping').reverse());
  $('#histChecks').innerHTML = rows.length ? `<table class="htable"><tr><th>Время</th><th>Цель</th><th>Запуск</th><th>Результат</th></tr>` +
    rows.map(c => `<tr><td>${new Date(c.ts * 1000).toLocaleString()}</td><td>${esc(S.targets[c.target]?.label || c.target)}</td><td>${src[c.source] || c.source}</td>` +
      (c.ok ? `<td class="ok">✓ ${c.mbps != null ? c.mbps + ' Mbit/s · ' : ''}${fmt(c.ms)}${c.loss ? ` · потери ${c.loss}%` : ''}</td>` : `<td class="bad">✕ ${esc(c.error || 'ошибка')}</td>`) + '</tr>').join('') +
    '</table>' : '<div style="color:var(--muted)">Нет проверок за период</div>';
}

// ping RTT over the selected period; failed pings drawn as red ticks at the bottom
function pingChart(pts) {
  if (pts.length < 2) return '';
  const W = 720, H = 120, P = 4, t0 = pts[0].ts, t1 = pts[pts.length - 1].ts || t0 + 1;
  const okp = pts.filter(c => c.ok), max = Math.max(50, ...okp.map(c => c.ms)) * 1.1;
  const x = ts => P + (W - 2 * P) * (ts - t0) / (t1 - t0 || 1), y = ms => H - P - (H - 2 * P) * ms / max;
  const line = okp.map(c => `${x(c.ts).toFixed(1)},${y(c.ms).toFixed(1)}`).join(' ');
  const fails = pts.filter(c => !c.ok).map(c => `<line x1="${x(c.ts)}" x2="${x(c.ts)}" y1="${H - P}" y2="${H - P - 10}" stroke="var(--bad)" stroke-width="2"><title>${new Date(c.ts * 1000).toLocaleString()}: ${esc(c.error)}</title></line>`).join('');
  const dots = okp.map(c => `<circle cx="${x(c.ts)}" cy="${y(c.ms)}" r="2.5" fill="${c.loss ? 'var(--mid)' : 'var(--good)'}"><title>${new Date(c.ts * 1000).toLocaleString()}: ${c.ms} ms${c.loss ? ', потери ' + c.loss + '%' : ''}</title></circle>`).join('');
  const ms = okp.map(c => c.ms);
  const stat = ms.length ? `мин ${Math.min(...ms)} · сред ${Math.round(ms.reduce((a, b) => a + b, 0) / ms.length)} · макс ${Math.max(...ms)} ms` : '';
  return `<div class="hbar" style="margin-top:14px">Пинг · ${pts.length} проверок · ${stat}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--bg);border:1px solid var(--border);border-radius:6px">
      <text x="${P + 2}" y="14" fill="var(--muted)" font-size="11">${Math.round(max)} ms</text>
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>${dots}${fails}</svg>`;
}

function render() {
  if (!S) return;
  if (!S.targets[target]) target = Object.keys(S.targets)[0];
  $('#tabs').innerHTML = Object.entries(S.targets).map(([k, t]) =>
    `<button data-k="${k}" class="${k === target ? 'on' : ''}" title="${esc(t.url || 'Пинг до адреса сервера напрямую (TCP, для UDP-протоколов ICMP)')}">${esc(t.label)}</button>`).join('');
  const protos = [...new Set(S.nodes.map(n => n.protocol))];
  const fp = $('#fProto');
  if (fp.options.length - 1 !== protos.length) fp.innerHTML = '<option value="">все</option>' + protos.map(p => `<option>${p}</option>`).join('');

  const res = S.results[target] || {};
  const q = $('#fText').value.toLowerCase();
  const watched = new Set(S.watched);
  const onlyW = $('#fWatched').checked;
  let nodes = S.nodes.filter(n => (!fp.value || n.protocol === fp.value) && (!q || (n.name + n.address).toLowerCase().includes(q)) && (!onlyW || watched.has(n.name)));
  const counts = { '': nodes.length, ok: 0, bad: 0, none: 0 };
  nodes.forEach(n => counts[nodeStatus(res[n.id])]++);
  $('#fStatus').querySelectorAll('button').forEach(b => {
    b.classList.toggle('on', b.dataset.s === status);
    const t = b.textContent.replace(/ \(\d+\)$/, '') + ` (${counts[b.dataset.s]})`;
    if (b.textContent !== t) b.textContent = t;
  });
  const sort = $('#sort').value;
  if (sort === 'name') nodes.sort((a, b) => a.name.localeCompare(b.name));
  if (sort === 'val') {
    const kind = S.targets[target].kind;
    const v = n => { const r = res[n.id]; if (!r || r.state !== 'done') return 1e9; if (!r.ok) return 1e8; return kind === 'download' ? -r.mbps : r.ms; };
    nodes.sort((a, b) => v(a) - v(b));
  }
  // export ignores the status filter: it picks all / working / failed itself
  shown = nodes;
  if (status) nodes = nodes.filter(n => nodeStatus(res[n.id]) === status);

  $('#view').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('#grid').classList.toggle('list', view === 'list');
  const lh = $('#lhead');
  lh.classList.toggle('on', view === 'list');
  const lhHtml = `<span></span><span></span><span>Сервер</span><span class="hp">Протокол · адрес</span><span>${esc(S.targets[target].label)}</span>` +
    `<span class="mh">${Object.values(S.targets).map(t => `<span>${esc(t.label)}</span>`).join('')}</span><span class="hs">Последние проверки</span>`;
  if (lh._html !== lhHtml) { lh.innerHTML = lhHtml; lh._html = lhHtml; }
  // keep cell elements alive between refreshes so hover zoom doesn't restart every second
  const grid = $('#grid'), keep = new Set();
  nodes.forEach((n, i) => {
    const r = res[n.id];
    const minis = Object.keys(S.targets).map(k => {
      const rr = S.results[k][n.id];
      return `<div class="mini ${grade(k, rr)} ${k === target ? 'sel' : ''}">${miniVal(k, rr)}</div>`;
    }).join('');
    let el = cells.get(n.id);
    if (!el) { el = document.createElement('div'); el.dataset.id = n.id; cells.set(n.id, el); }
    keep.add(n.id);
    const cls = `cell ${grade(target, r)}`, tip = title(n);
    if (el.className !== cls) el.className = cls;
    if (el.title !== tip) el.title = tip;
    const html = `<button class="hist" data-name="${esc(n.name)}" title="История проверок">⏱</button>
      <button class="star ${watched.has(n.name) ? 'on' : ''}" data-name="${esc(n.name)}" title="Фоновая проверка">${watched.has(n.name) ? '★' : '☆'}</button>
      <div class="name">${nameHtml(n.name)}</div>
      <div class="proto"><span class="p">${esc(n.protocol)}</span> · ${esc(n.network)} · ${esc(n.security)} · ${esc(n.address)}</div>
      ${mainVal(target, r)}
      <div class="minis">${minis}</div>
      ${strip(S.recent?.[n.name]?.[target])}`;
    if (el._html !== html) { el.innerHTML = html; el._html = html; }
    if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null);
  });
  for (const [id, el] of cells) if (!keep.has(id)) { el.remove(); cells.delete(id); }

  const all = Object.values(res), done = all.filter(r => r.state === 'done');
  const ok = done.filter(r => r.ok).length;
  $('#summary').innerHTML = `Серверов: <b>${S.nodes.length}</b> · ${esc(S.targets[target].label)}: <b style="color:var(--good)">${ok}</b> ок / <b style="color:var(--bad)">${done.length - ok}</b> недоступно` +
    (S.active ? ` · в работе: <b style="color:var(--accent-t)">${S.active}</b>` : '') + ` · таймаут ${S.timeout}s`;
  const wi = $('#watchInfo');
  if (!S.watch_interval) wi.textContent = '';
  else {
    const next = S.watch_last_run ? new Date((S.watch_last_run + S.watch_interval) * 1000) : null;
    const nw = S.nodes.filter(n => watched.has(n.name)).length;
    wi.innerHTML = `★ фон: <b>${nw}</b> раз в ${S.watch_interval / 3600} ч` +
      (S.watch_last_run ? ` · последняя ${new Date(S.watch_last_run * 1000).toLocaleString()} · следующая ${next.toLocaleString()}` : '');
  }
  const err = $('#err');
  err.style.display = S.load_error ? 'block' : 'none';
  err.textContent = S.load_error ? 'Ошибка загрузки подписки: ' + S.load_error : '';
}

async function refresh() {
  try { S = await (await fetch('/api/state')).json(); render(); } catch (e) {}
}
async function check(targets, ids) {
  await fetch('/api/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ targets, ids }) });
  refresh();
}

const themeBtn = $('#theme');
const setTheme = t => {
  if (t === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme;
  themeBtn.textContent = t === 'light' ? '☾' : '☀';
  try { localStorage.setItem('theme', t); } catch (e) {}
};
setTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
$('#view').onclick = e => { const v = e.target.dataset.v; if (v) { view = v; localStorage.setItem('view', v); render(); } };
$('#fStatus').onclick = e => { const b = e.target.closest('button'); if (b) { status = b.dataset.s; localStorage.setItem('status', status); render(); } };
$('#tabs').onclick = e => { const k = e.target.dataset.k; if (k) { target = k; localStorage.setItem('target', k); render(); } };
$('#grid').onclick = async e => {
  const h = e.target.closest('.hist');
  if (h) return openHistory(h.dataset.name);
  const st = e.target.closest('.star');
  if (st) {
    await fetch('/api/watch', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: st.dataset.name, on: !st.classList.contains('on') }) });
    return refresh();
  }
  const c = e.target.closest('.cell'); if (c) check([target], [+c.dataset.id]); };
$('#runSel').onclick = () => check([target]);
$('#runAll').onclick = () => check(Object.keys(S.targets));
$('#reload').onclick = async e => {
  e.target.disabled = true; e.target.textContent = 'Загрузка…';
  await fetch('/api/reload', { method: 'POST' });
  e.target.disabled = false; e.target.textContent = 'Обновить подписку'; refresh();
};
$('#report').onclick = () => {
  if (!S) return;
  const res = S.results[target] || {};
  const failed = S.nodes.filter(n => { const r = res[n.id]; return r && r.state === 'done' && !r.ok; });
  $('#reportTitle').textContent = `${S.targets[target].label}: недоступно ${failed.length}`;
  $('#reportText').value = failed.map(n => n.name).join('\n');
  $('#reportCopy').textContent = 'Копировать';
  $('#reportSave').hidden = $('#mdType').hidden = true;
  $('#reportDlg').showModal();
};
// Telegram parses **bold** and `code` when the text is pasted into the message box; tables aren't supported, so one line per server
$('#exportMd').onclick = () => {
  if (!S) return;
  mdType = status === 'ok' || status === 'bad' ? status : '';
  renderMd();
  $('#reportCopy').textContent = 'Копировать';
  $('#reportSave').hidden = $('#mdType').hidden = false;
  $('#reportDlg').showModal();
};
$('#mdType').onclick = e => { const b = e.target.closest('button'); if (b) { mdType = b.dataset.t; renderMd(); $('#reportCopy').textContent = 'Копировать'; } };
function renderMd() {
  const res = S.results[target] || {};
  const icon = { ok: '✅', bad: '❌', none: '⏳' };
  // drop backticks and collapse **, __, ~~ so server names can't toggle formatting
  const md = s => String(s ?? '').replace(/`/g, "'").replace(/([*_~|])\1+/g, '$1');
  const keys = Object.keys(S.targets);
  const vals = n => keys.map(k => `${S.targets[k].label} ${S.results[k][n.id] ? miniVal(k, S.results[k][n.id]) : '—'}`).join(' · ');
  const cnt = { ok: 0, bad: 0, none: 0 };
  shown.forEach(n => cnt[nodeStatus(res[n.id])]++);
  const list = mdType ? shown.filter(n => nodeStatus(res[n.id]) === mdType) : shown;
  const head = mdType === 'ok' ? `✅ Рабочие: **${cnt.ok}** из ${shown.length}` : mdType === 'bad' ? `❌ Нерабочие: **${cnt.bad}** из ${shown.length}`
    : `✅ ${cnt.ok} · ❌ ${cnt.bad}` + (cnt.none ? ` · ⏳ ${cnt.none}` : '');
  const lines = [
    `**Xray Checker** · ${new Date().toLocaleString()}`,
    `Цель: **${md(S.targets[target].label)}** · ${head}`,
    '',
    ...list.map(n => {
      const r = res[n.id], st = nodeStatus(r);
      const main = st === 'bad' ? md(r.error || 'ошибка') : st === 'ok' ? (S.targets[target].kind === 'download' ? `${r.mbps} Mbit/s` : fmt(r.ms)) : 'не проверен';
      return `${icon[st]} **${md(n.name)}** — ${main}\n    \`${n.protocol} · ${vals(n)}\``;
    }),
  ];
  const text = lines.join('\n');
  $('#mdType').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === mdType));
  $('#reportTitle').textContent = `Markdown · серверов: ${list.length} · символов: ${text.length}` + (text.length > 4096 ? ' (Telegram разобьёт на несколько сообщений)' : '');
  $('#reportText').value = text;
}
$('#reportSave').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([$('#reportText').value], { type: 'text/markdown' }));
  a.download = `xray-${target}-${{ ok: 'ok-', bad: 'failed-' }[mdType] || ''}${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
};
$('#reportCopy').onclick = async e => {
  const t = $('#reportText');
  try { await navigator.clipboard.writeText(t.value); } catch { t.select(); document.execCommand('copy'); }
  e.target.textContent = 'Скопировано';
};
$('#histClose').onclick = () => $('#histDlg').close();
['#histTarget', '#histDays'].forEach(s => $(s).onchange = loadHistory);
$('#reportClose').onclick = () => $('#reportDlg').close();
['#fProto', '#sort', '#fWatched'].forEach(s => $(s).onchange = render);
$('#fText').oninput = render;

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
