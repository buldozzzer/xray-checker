<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xray Checker</title>
<script>try { const t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); if (t === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Russo+One&display=swap">
<style>
/* cyberpunk: night city (dark) / corpo daylight (light); neon = cyan, neon2 = magenta, accent = signal yellow */
:root {
  --bg: #07060d; --panel: #0d0b17; --cell: #100e1c; --border: #2b2542;
  --text: #e9f7ff; --muted: #8088a6; --accent: #fcee0a; --accent-t: #fcee0a; --on-accent: #07060d;
  --neon: #00f0ff; --neon2: #ff2a6d;
  --good: #00ff9c; --mid: #ffc400; --slow: #ff7a1a; --bad: #ff2a6d; --idle: #2e2846;
  --good-t: #6dffc4; --mid-t: #ffd860; --slow-t: #ffa266; --bad-t: #ff7096;
  --header-bg: rgba(7,6,13,.86); --cell-hover: #161229; --shadow: rgba(0,0,0,.6); --backdrop: rgba(4,3,10,.78);
  --err-bg: #2a0714; --mini-bg: #1a1630; --flag-ring: rgba(255,255,255,.15);
  --grid-line: rgba(0,240,255,.045); --haze: 16%; --scan: rgba(0,0,0,.2); --glow: 1;
  --lift: 0 0 0 1px var(--neon), 0 0 24px rgba(0,240,255,.35), 0 14px 40px var(--shadow);
  --title-shadow: -1.5px 0 var(--neon2), 1.5px 0 var(--neon), 0 0 18px rgba(0,240,255,.45);
  --font: "Exo 2", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace; --display: "Russo One", "Exo 2", sans-serif;
  --cut: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px));
  --slant: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #e7ebf0; --panel: #f7f9fb; --cell: #ffffff; --border: #aab4c5;
  --text: #0a0c16; --muted: #4a5470; --accent: #fcee0a; --accent-t: #c4005a; --on-accent: #0a0c16;
  --neon: #0089a3; --neon2: #e0005a;
  --good: #00a86b; --mid: #d99a00; --slow: #e8590c; --bad: #e0004d; --idle: #c3cbd8;
  --good-t: #007a4d; --mid-t: #8a6100; --slow-t: #b04000; --bad-t: #b3003d;
  --header-bg: rgba(231,235,240,.9); --cell-hover: #ffffff; --shadow: rgba(10,12,22,.2); --backdrop: rgba(10,12,22,.45);
  --err-bg: #ffe3ec; --mini-bg: #e9edf3; --flag-ring: rgba(0,0,0,.2);
  --grid-line: rgba(0,137,163,.08); --haze: 9%; --scan: transparent; --glow: 0;
  --lift: 0 0 0 1px var(--text), 5px 5px 0 var(--neon2);
  --title-shadow: -1px 0 var(--neon2), 1px 0 var(--neon);
  color-scheme: light;
}
* { box-sizing: border-box; }
::selection { background: var(--neon2); color: #fff; }
html { scrollbar-color: var(--border) var(--bg); }
body { margin: 0; overflow-x: hidden; color: var(--text); font: 14px/1.4 var(--font);
  background:
    radial-gradient(1100px 600px at 105% -10%, color-mix(in srgb, var(--neon2) var(--haze), transparent), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, color-mix(in srgb, var(--neon) var(--haze), transparent), transparent 60%),
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / 32px 32px,
    var(--bg);
  background-attachment: fixed; }
/* CRT scanlines over the page (dark only, ignores the pointer) */
body::after { content: ''; position: fixed; inset: 0; z-index: 20; pointer-events: none;
  background: repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px); }
header { position: sticky; top: 0; z-index: 5; background: var(--header-bg); backdrop-filter: blur(8px);
  padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 8px; align-items: center; }
header h1 { margin-right: 8px; }
header::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: linear-gradient(90deg, var(--neon2), var(--accent) 50%, var(--neon));
  box-shadow: 0 0 calc(12px * var(--glow)) color-mix(in srgb, var(--neon2) 60%, transparent); }
h1 { font: 18px/1 var(--display); margin: 0; letter-spacing: .12em; text-transform: uppercase; text-shadow: var(--title-shadow); }
h1 span { color: var(--accent-t); text-shadow: 0 0 calc(12px * var(--glow)) var(--accent); }
.tabs { display: flex; gap: 2px; background: var(--panel); padding: 3px; border: 1px solid var(--border); flex-wrap: wrap; clip-path: var(--cut); }
.tabs button { background: none; border: 0; color: var(--muted); padding: 6px 14px; cursor: pointer;
  font: 600 12px/1.4 var(--font); text-transform: uppercase; letter-spacing: .08em; }
.tabs button:hover { color: var(--neon); }
.tabs button.on { background: var(--accent); color: var(--on-accent); clip-path: var(--slant); }
.btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; cursor: pointer;
  font: 600 12px/1.4 var(--font); text-transform: uppercase; letter-spacing: .04em; clip-path: var(--cut);
  transition: color .15s, border-color .15s, box-shadow .15s, background .15s; }
.btn:hover { border-color: var(--neon); color: var(--neon); box-shadow: inset 0 0 calc(14px * var(--glow)) color-mix(in srgb, var(--neon) 35%, transparent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { background: var(--text); border-color: var(--text); color: var(--bg); }
.btn:disabled { opacity: .5; cursor: progress; }
.spacer { flex: 1; }
[hidden] { display: none !important; }
/* filters: controls row + info row */
.filters { padding: 14px 16px 8px; display: grid; gap: 10px; font-size: 13px; }
.frow { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.frow.info { color: var(--muted); font-size: 12px; gap: 6px 16px; }
.frow.info b { color: var(--text); font-family: var(--mono); }
.search { position: relative; flex: 1 1 240px; max-width: 340px; display: flex; align-items: center; }
.search input { width: 100%; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 0;
  padding: 7px 30px; font: inherit; }
.search svg { position: absolute; left: 9px; width: 14px; height: 14px; color: var(--muted); pointer-events: none; }
.search kbd { position: absolute; right: 8px; font: 11px/1.4 var(--mono); color: var(--muted); border: 1px solid var(--border); padding: 0 5px; pointer-events: none; }
.search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd, .search input:placeholder-shown ~ .sclear { display: none; }
.sclear { position: absolute; right: 4px; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; padding: 4px 6px; }
.sclear:hover { color: var(--bad-t); }
.search input:focus, .fsel select:focus, .hbar select:focus { outline: 0; border-color: var(--neon); box-shadow: 0 0 0 3px color-mix(in srgb, var(--neon) 22%, transparent); }
.fsel { color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.fsel select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 0; padding: 6px 8px; font: inherit; }
.chip { background: var(--panel); color: var(--muted); border: 1px solid var(--border); padding: 5px 10px; cursor: pointer; font: inherit; }
.chip:hover { color: var(--neon); border-color: var(--neon); }
.chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.view button .n, .chip .n { margin-left: 6px; font: 11px var(--mono); opacity: .7; }
.view button.on .n, .chip.on .n { opacity: 1; }
.view button.zero { opacity: .45; }
#fProto button { text-transform: uppercase; font-size: 12px; letter-spacing: .04em; }
.flink { background: none; border: 0; padding: 0; color: var(--neon); cursor: pointer; font: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
.flink:hover { color: var(--accent-t); }
.empty { margin: 24px 16px; padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--border); }
.empty b { display: block; color: var(--text); font: 15px/1.3 var(--display); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
input[type="checkbox"] { accent-color: var(--neon2); }
.legend i { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 10px; vertical-align: -1px; transform: skewX(-15deg); }
.err { margin: 0 16px 10px; padding: 10px 12px; background: var(--err-bg); border: 1px solid var(--bad); border-left-width: 4px;
  color: var(--bad-t); font-family: var(--mono); font-size: 13px; clip-path: var(--cut); display: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; padding: 6px 16px 24px; }
.cell { --st: var(--idle); background: var(--cell); border: 1px solid var(--border); border-left: 4px solid var(--st);
  padding: 9px 10px 8px; cursor: pointer; position: relative; min-width: 0;
  box-shadow: inset 10px 0 14px -12px var(--st);
  transition: transform .18s ease, box-shadow .18s ease, border-color .15s; }
/* HUD corner bracket */
.cell::after { content: ''; position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; pointer-events: none;
  border-right: 2px solid var(--neon); border-bottom: 2px solid var(--neon); opacity: .45; transition: opacity .15s; }
.cell:hover { border-color: var(--neon); border-left-color: var(--st); }
.cell:hover::after { opacity: 1; }
@media (hover: hover) {
  .cell:hover { transform: scale(1.12); z-index: 3; background: var(--cell-hover); box-shadow: var(--lift); }
}
.cell.good { --st: var(--good); } .cell.mid { --st: var(--mid); }
.cell.slow { --st: var(--slow); } .cell.bad { --st: var(--bad); }
.cell.run { --st: var(--accent); background-image: linear-gradient(100deg, transparent 35%, color-mix(in srgb, var(--neon) 14%, transparent) 50%, transparent 65%);
  background-size: 250% 100%; animation: sweep 1.3s linear infinite; }
@keyframes sweep { from { background-position: 150% 0; } to { background-position: -50% 0; } }
@media (prefers-reduced-motion: reduce) { .cell { transition: none; } .cell.run { animation: none; } }
.name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px; }
.star { position: absolute; top: 6px; right: 7px; background: none; border: 0; padding: 0; cursor: pointer;
  font-size: 15px; line-height: 1; color: var(--idle); }
.star:hover { color: var(--accent-t); }
.star.on { color: var(--accent-t); text-shadow: 0 0 calc(8px * var(--glow)) var(--accent); }
.hist { position: absolute; top: 6px; right: 26px; background: none; border: 0; padding: 0; cursor: pointer;
  font-size: 13px; line-height: 1; color: var(--muted); }
.hist:hover { color: var(--neon); }
.name { padding-right: 38px; }
.strip { display: flex; gap: 1px; height: 6px; margin-top: 5px; }
.strip i { flex: 1; max-width: 6px; background: var(--bad); opacity: .85; }
.strip i.ok { background: var(--good); }
#histDlg { width: min(760px, calc(100vw - 32px)); }
.htable { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.htable th, .htable td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.htable th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.htable td.ok { color: var(--good-t); } .htable td.bad { color: var(--bad-t); }
.hscroll { max-height: 50vh; overflow: auto; margin-top: 12px; }
.hbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.hbar select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 0; padding: 4px 6px; font: inherit; text-transform: none; letter-spacing: 0; }
.name .fi { margin-right: 6px; box-shadow: 0 0 0 1px var(--flag-ring); }
.proto { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
.proto .p { color: var(--neon); text-transform: uppercase; font-weight: 700; }
.val { font: 700 20px/1.3 var(--mono); margin: 6px 0 2px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 0 calc(10px * var(--glow)) color-mix(in srgb, currentColor 55%, transparent); }
.cell.good .val { color: var(--good-t); } .cell.mid .val { color: var(--mid-t); } .cell.slow .val { color: var(--slow-t); }
.val small { font-size: 11px; color: var(--muted); font-weight: 400; text-shadow: none; }
.val.e { font: 600 13px/1.5 var(--mono); color: var(--bad-t); }
.minis { display: flex; gap: 3px; margin-top: 4px; }
.mini { flex: 1; font: 10px/1.4 var(--mono); text-align: center; padding: 2px 0; background: var(--mini-bg); color: var(--muted);
  white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
.mini.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good-t); }
.mini.mid { background: color-mix(in srgb, var(--mid) 18%, transparent); color: var(--mid-t); }
.mini.slow { background: color-mix(in srgb, var(--slow) 18%, transparent); color: var(--slow-t); }
.mini.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad-t); }
.mini.run { color: var(--accent-t); }
.mini.sel { outline: 1px solid var(--neon); }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-top: 2px solid var(--neon2); padding: 18px;
  width: min(560px, calc(100vw - 32px)); clip-path: var(--cut); }
dialog::backdrop { background: var(--backdrop); backdrop-filter: blur(2px); }
dialog h2 { font: 15px/1.3 var(--display); margin: 0 0 12px; letter-spacing: .06em; text-transform: uppercase; }
dialog textarea { width: 100%; height: 50vh; background: var(--bg); color: var(--text); border: 1px solid var(--border);
  padding: 8px; font: 13px/1.5 var(--mono); resize: vertical; }
dialog textarea:focus { outline: 1px solid var(--neon); }
dialog .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
/* list view: same cells laid out as table rows */
.grid.list, .lhead { --cols: 18px 18px minmax(170px, 1.6fr) minmax(150px, 1.3fr) minmax(130px, 1fr) minmax(170px, 1.2fr) minmax(90px, 140px); }
.grid.list { grid-template-columns: 1fr; gap: 4px; padding-top: 0; }
.grid.list .cell, .lhead { display: grid; grid-template-columns: var(--cols); gap: 10px; align-items: center; padding: 6px 10px; }
.grid.list .hist, .grid.list .star { position: static; }
.grid.list .name, .grid.list .proto, .grid.list .val, .grid.list .minis, .grid.list .strip { margin: 0; padding-right: 0; }
.grid.list .val { font-size: 15px; }
.grid.list .strip { height: 8px; }
.lhead { display: none; margin: 0 16px 4px; border-left: 4px solid transparent; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.lhead.on { display: grid; }
.lhead .mh { display: flex; gap: 3px; } .lhead .mh span { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) { .grid.list .cell:hover { transform: scale(1.015); } }
.view { display: inline-flex; border: 1px solid var(--border); overflow: hidden; vertical-align: middle; background: var(--panel); }
.view button { background: none; color: var(--muted); border: 0; padding: 5px 10px; cursor: pointer; font: inherit; }
.view button:hover { color: var(--neon); }
.view button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; clip-path: var(--slant); }
@media (max-width: 760px) {
  .grid.list, .lhead { --cols: 18px 18px minmax(0, 1fr) 110px; }
  .grid.list .proto, .grid.list .minis, .grid.list .strip, .lhead .hp, .lhead .mh, .lhead .hs { display: none; }
}
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 6px 10px 20px; } header, .filters { padding-left: 10px; padding-right: 10px; } .search { max-width: none; flex-basis: 100%; } }
</style>
</head>
<body>
<header>
  <h1><span>⬢</span> Xray Checker</h1>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <button class="btn primary" id="runSel">Проверить</button>
  <button class="btn" id="runAll">Все цели</button>
  <button class="btn" id="reload">Обновить подписку</button>
  <button class="btn" id="report">Сформировать отчёт</button>
  <button class="btn" id="exportMd" title="Серверы с текущими фильтрами — в Markdown для Telegram">Экспорт MD</button>
  <button class="btn" id="theme" title="Светлая / тёмная тема"></button>
</header>
<dialog id="reportDlg">
  <h2 id="reportTitle"></h2>
  <div class="hbar" id="mdType" hidden>Выгрузить <span class="view"><button data-t="">все</button><button data-t="ok">✓ рабочие</button><button data-t="bad">✕ нерабочие</button></span></div>
  <textarea id="reportText" readonly></textarea>
  <div class="acts"><button class="btn" id="reportSave" hidden>Скачать .md</button><button class="btn" id="reportCopy">Копировать</button><button class="btn primary" id="reportClose">Закрыть</button></div>
</dialog>
<div class="filters">
  <div class="frow">
    <label class="search" title="Поиск по имени или адресу (горячая клавиша /, Esc — очистить)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
      <input id="fText" placeholder="Поиск: имя или адрес" autocomplete="off" spellcheck="false">
      <kbd>/</kbd><button class="sclear" id="fClear" type="button" title="Очистить поиск">✕</button>
    </label>
    <span class="view" id="fStatus"></span>
    <span class="view" id="fProto" title="Протокол"></span>
    <button class="chip" id="fWatched" title="Только серверы с фоновой проверкой (★)"></button>
    <span class="spacer"></span>
    <label class="fsel">Сортировка <select id="sort"><option value="">как в подписке</option><option value="val">по задержке</option><option value="name">по имени</option></select></label>
    <span class="view" id="view"><button data-v="grid" title="Матрица">▦ Матрица</button><button data-v="list" title="Список">☰ Список</button></span>
  </div>
  <div class="frow info">
    <span id="summary"></span>
    <span id="shownInfo"></span>
    <span id="watchInfo"></span>
    <span class="spacer"></span>
    <span class="legend"><i style="background:var(--good)"></i>быстро<i style="background:var(--mid)"></i>норм<i style="background:var(--slow)"></i>медленно<i style="background:var(--bad)"></i>недоступен</span>
  </div>
</div>
<dialog id="histDlg">
  <h2 id="histTitle"></h2>
  <div class="hbar">Доступность (успешных проверок)</div>
  <div id="histUptime"></div>
  <div id="histChart"></div>
  <div class="hbar" style="margin-top:14px">Проверки
    <select id="histTarget"><option value="">все цели</option></select>
    <select id="histDays"><option value="1">24 ч</option><option value="7">7 дней</option><option value="30" selected>30 дней</option><option value="90">90 дней</option></select>
  </div>
  <div class="hscroll" id="histChecks"></div>
  <div class="acts"><button class="btn primary" id="histClose">Закрыть</button></div>
</dialog>
<div class="err" id="err"></div>
<div class="lhead" id="lhead"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden><b>Ничего не найдено</b>Под текущие фильтры не подходит ни один сервер. <button class="flink freset">Сбросить фильтры</button></div>

<script>
const $ = s => document.querySelector(s);
const cells = new Map();
let S = null, shown = [], mdType = '', target = localStorage.getItem('target') || 'cloudflare';
let view = localStorage.getItem('view') === 'list' ? 'list' : 'grid';
let status = localStorage.getItem('status') || '';
let proto = localStorage.getItem('proto') || '', onlyW = localStorage.getItem('onlyW') === '1';
$('#sort').value = localStorage.getItem('sort') || '';
const STATUS = [['', 'все', 'Все серверы'], ['ok', '✓ рабочие', 'Последняя проверка выбранной цели успешна'],
  ['bad', '✕ нерабочие', 'Последняя проверка выбранной цели неуспешна'], ['none', 'не проверены', 'Ещё не проверены или проверяются сейчас']];
// segmented filter: items are [value, label html, count, title]; rebuilt only on change so clicks aren't lost to the 1 s refresh
function seg(el, key, cur, items) {
  const html = items.map(([v, l, n, t]) => `<button data-${key}="${esc(v)}" class="${v === cur ? 'on' : ''}${n ? '' : ' zero'}"` +
    `${t ? ` title="${t}"` : ''}>${l}<span class="n">${n}</span></button>`).join('');
  if (el._html !== html) { el.innerHTML = html; el._html = html; }
}
// status of a node for the selected target: ok / bad / none (not checked yet or in progress)
const nodeStatus = r => !r || r.state !== 'done' ? 'none' : r.ok ? 'ok' : 'bad';

// thresholds in ms (latency, ping) or Mbit/s (download)
const grade = (key, r) => {
  if (!r || r.state !== 'done') return r && r.state ? 'run' : '';
  if (!r.ok) return 'bad';
  const kind = S.targets[key].kind;
  if (kind === 'download') return r.mbps >= 20 ? 'good' : r.mbps >= 5 ? 'mid' : 'slow';
  if (kind === 'ping') return r.ms >= 300 || r.loss >= 50 ? 'slow' : r.ms >= 100 || r.loss > 0 ? 'mid' : 'good';
  return r.ms < 500 ? 'good' : r.ms < 1500 ? 'mid' : 'slow';
};
const fmt = ms => ms >= 10000 ? (ms / 1000).toFixed(1) + ' s' : ms + ' ms';
function mainVal(key, r) {
  if (!r) return '<div class="val"><small>—</small></div>';
  if (r.state === 'queued') return '<div class="val"><small>в очереди…</small></div>';
  if (r.state === 'running') return `<div class="val"><small>проверка ${Math.round(Date.now()/1000 - r.started)}s…</small></div>`;
  if (!r.ok) return `<div class="val e">✕ ${esc(r.error || 'ошибка')}</div>`;
  const kind = S.targets[key].kind;
  if (kind === 'download') return `<div class="val">${r.mbps} <small>Mbit/s · ${fmt(r.ms)}</small></div>`;
  if (kind === 'ping') return `<div class="val">${fmt(r.ms)} <small>${r.method} ${r.min_ms}–${r.max_ms}${r.loss ? ` · потери ${r.loss}%` : ''}</small></div>`;
  if (kind === 'ip') return `<div class="val">${fmt(r.ms)} <small>${esc(r.ip)}</small></div>`;
  return `<div class="val">${fmt(r.ms)} <small>ttfb ${r.ttfb_ms}</small></div>`;
}
function miniVal(key, r) {
  if (!r) return '·';
  if (r.state !== 'done') return '…';
  if (!r.ok) return '✕';
  return S.targets[key].kind === 'download' ? r.mbps + 'M' : r.ms;
}
// leading emoji flag (pair of regional indicators) -> ISO code; rendered as SVG since Windows has no flag emoji
function splitFlag(name) {
  const m = /^\s*([\u{1F1E6}-\u{1F1FF}]{2})\s*/u.exec(name);
  if (!m) return { cc: '', rest: name };
  const cc = [...m[1]].map(c => String.fromCharCode(c.codePointAt(0) - 0x1F1E6 + 97)).join('');
  return { cc, rest: name.slice(m[0].length) };
}
function nameHtml(name) {
  const { cc, rest } = splitFlag(name);
  return (cc ? `<span class="fi fi-${cc}" title="${cc.toUpperCase()}"></span>` : '') + esc(rest);
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function title(n) {
  const lines = [n.name, `${n.protocol} · ${n.network} · ${n.security}`, `${n.address}:${n.port}`, `local proxy 127.0.0.1:${n.port_local}`];
  for (const k in S.targets) {
    const r = S.results[k][n.id];
    if (r && r.state === 'done' && S.targets[k].kind === 'ping') lines.push(`${S.targets[k].label} (${r.method}): ` + (r.ok
      ? `${r.ms} ms (min ${r.min_ms}, max ${r.max_ms}, ${r.recv}/${r.sent}, потери ${r.loss}%)` : `${r.error}${r.detail ? ' — ' + r.detail : ''}`));
    else if (r && r.state === 'done') lines.push(`${S.targets[k].label}: ` + (r.ok ? `${r.ms} ms (ttfb ${r.ttfb_ms}, HTTP ${r.status}, ${r.bytes} B)${r.ip ? ' ' + r.ip : ''}` : `${r.error}${r.detail ? ' — ' + r.detail : ''}`));
  }
  const ts = Math.max(0, ...Object.keys(S.targets).map(k => S.results[k][n.id]?.ts || 0));
  if (ts) lines.push('Проверено: ' + new Date(ts * 1000).toLocaleString());
  if (n.error) lines.push('xray: ' + n.error);
  return lines.join('\n') + '\n\nКлик — перепроверить';
}

function strip(bits) {
  if (!bits) return '';
  return `<div class="strip" title="Последние проверки: ${[...bits].filter(b => b === '1').length} из ${bits.length} успешны">` +
    [...bits].map(b => `<i class="${b === '1' ? 'ok' : ''}"></i>`).join('') + '</div>';
}

let histName = null;
async function openHistory(name) {
  histName = name;
  const ht = $('#histTarget');
  if (ht.options.length === 1) ht.innerHTML += Object.entries(S.targets).map(([k, t]) => `<option value="${k}">${esc(t.label)}</option>`).join('');
  $('#histTitle').innerHTML = nameHtml(name);
  if (!$('#histDlg').open) $('#histDlg').showModal();
  await loadHistory();
}
async function loadHistory() {
  const H = await (await fetch(`/api/history?name=${encodeURIComponent(histName)}&days=${$('#histDays').value}`)).json();
  const pct = u => u ? `${(100 * u.ok / u.total).toFixed(1)}% <small style="color:var(--muted)">(${u.ok}/${u.total})</small>` : '—';
  const targets = Object.keys(S.targets).filter(k => H.uptime[k]);
  $('#histUptime').innerHTML = targets.length ? `<table class="htable"><tr><th>Цель</th><th>24 ч</th><th>7 дней</th><th>30 дней</th></tr>` +
    targets.map(k => `<tr><td>${esc(S.targets[k].label)}</td><td>${pct(H.uptime[k]['24h'])}</td><td>${pct(H.uptime[k]['7d'])}</td><td>${pct(H.uptime[k]['30d'])}</td></tr>`).join('') +
    '</table>' : '<div style="color:var(--muted)">Проверок за 30 дней нет</div>';
  const tf = $('#histTarget').value;
  const src = { manual: 'вручную', watch: 'фон ★', auto: 'авто' };
  const rows = H.checks.filter(c => !tf || c.target === tf);
  $('#histChart').innerHTML = pingChart(H.checks.filter(c => S.targets[c.target]?.kind === 'ping').reverse());
  $('#histChecks').innerHTML = rows.length ? `<table class="htable"><tr><th>Время</th><th>Цель</th><th>Запуск</th><th>Результат</th></tr>` +
    rows.map(c => `<tr><td>${new Date(c.ts * 1000).toLocaleString()}</td><td>${esc(S.targets[c.target]?.label || c.target)}</td><td>${src[c.source] || c.source}</td>` +
      (c.ok ? `<td class="ok">✓ ${c.mbps != null ? c.mbps + ' Mbit/s · ' : ''}${fmt(c.ms)}${c.loss ? ` · потери ${c.loss}%` : ''}</td>` : `<td class="bad">✕ ${esc(c.error || 'ошибка')}</td>`) + '</tr>').join('') +
    '</table>' : '<div style="color:var(--muted)">Нет проверок за период</div>';
}

// ping RTT over the selected period; failed pings drawn as red ticks at the bottom
function pingChart(pts) {
  if (pts.length < 2) return '';
  const W = 720, H = 120, P = 4, t0 = pts[0].ts, t1 = pts[pts.length - 1].ts || t0 + 1;
  const okp = pts.filter(c => c.ok), max = Math.max(50, ...okp.map(c => c.ms)) * 1.1;
  const x = ts => P + (W - 2 * P) * (ts - t0) / (t1 - t0 || 1), y = ms => H - P - (H - 2 * P) * ms / max;
  const line = okp.map(c => `${x(c.ts).toFixed(1)},${y(c.ms).toFixed(1)}`).join(' ');
  const fails = pts.filter(c => !c.ok).map(c => `<line x1="${x(c.ts)}" x2="${x(c.ts)}" y1="${H - P}" y2="${H - P - 10}" stroke="var(--bad)" stroke-width="2"><title>${new Date(c.ts * 1000).toLocaleString()}: ${esc(c.error)}</title></line>`).join('');
  const dots = okp.map(c => `<circle cx="${x(c.ts)}" cy="${y(c.ms)}" r="2.5" fill="${c.loss ? 'var(--mid)' : 'var(--good)'}"><title>${new Date(c.ts * 1000).toLocaleString()}: ${c.ms} ms${c.loss ? ', потери ' + c.loss + '%' : ''}</title></circle>`).join('');
  const ms = okp.map(c => c.ms);
  const stat = ms.length ? `мин ${Math.min(...ms)} · сред ${Math.round(ms.reduce((a, b) => a + b, 0) / ms.length)} · макс ${Math.max(...ms)} ms` : '';
  return `<div class="hbar" style="margin-top:14px">Пинг · ${pts.length} проверок · ${stat}</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--bg);border:1px solid var(--border)">
      <text x="${P + 2}" y="14" fill="var(--muted)" font-size="11">${Math.round(max)} ms</text>
      <polyline points="${line}" fill="none" stroke="var(--neon)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>${dots}${fails}</svg>`;
}

function render() {
  if (!S) return;
  if (!S.targets[target]) target = Object.keys(S.targets)[0];
  $('#tabs').innerHTML = Object.entries(S.targets).map(([k, t]) =>
    `<button data-k="${k}" class="${k === target ? 'on' : ''}" title="${esc(t.url || 'Пинг до адреса сервера напрямую (TCP, для UDP-протоколов ICMP)')}">${esc(t.label)}</button>`).join('');
  const res = S.results[target] || {};
  const q = $('#fText').value.toLowerCase();
  const watched = new Set(S.watched);
  const protos = [...new Set(S.nodes.map(n => n.protocol))];
  if (proto && !protos.includes(proto)) proto = '';
  // each filter group counts what it would show with the other filters applied
  const base = S.nodes.filter(n => (!q || (n.name + n.address).toLowerCase().includes(q)) && (!onlyW || watched.has(n.name)));
  const pc = { '': base.length };
  base.forEach(n => pc[n.protocol] = (pc[n.protocol] || 0) + 1);
  $('#fProto').hidden = protos.length < 2;
  seg($('#fProto'), 'p', proto, ['', ...protos].map(p => [p, p ? esc(p) : 'все', pc[p] || 0]));
  let nodes = base.filter(n => !proto || n.protocol === proto);
  const counts = { '': nodes.length, ok: 0, bad: 0, none: 0 };
  nodes.forEach(n => counts[nodeStatus(res[n.id])]++);
  seg($('#fStatus'), 's', status, STATUS.map(([s, l, t]) => [s, l, counts[s], t]));
  const nw = S.nodes.filter(n => watched.has(n.name)).length;
  const fw = $('#fWatched'), fwHtml = `★ избранные<span class="n">${nw}</span>`;
  fw.classList.toggle('on', onlyW);
  if (fw.innerHTML !== fwHtml) fw.innerHTML = fwHtml;
  const sort = $('#sort').value;
  if (sort === 'name') nodes.sort((a, b) => a.name.localeCompare(b.name));
  if (sort === 'val') {
    const kind = S.targets[target].kind;
    const v = n => { const r = res[n.id]; if (!r || r.state !== 'done') return 1e9; if (!r.ok) return 1e8; return kind === 'download' ? -r.mbps : r.ms; };
    nodes.sort((a, b) => v(a) - v(b));
  }
  // export ignores the status filter: it picks all / working / failed itself
  shown = nodes;
  if (status) nodes = nodes.filter(n => nodeStatus(res[n.id]) === status);
  const filtered = !!(status || proto || onlyW || q);
  const si = $('#shownInfo'), siHtml = filtered ? `Показано <b>${nodes.length}</b> из ${S.nodes.length} · <button class="flink freset">сбросить фильтры</button>` : '';
  if (si.innerHTML !== siHtml) si.innerHTML = siHtml;
  $('#empty').hidden = nodes.length > 0 || !S.nodes.length;

  $('#view').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('#grid').classList.toggle('list', view === 'list');
  const lh = $('#lhead');
  lh.classList.toggle('on', view === 'list');
  const lhHtml = `<span></span><span></span><span>Сервер</span><span class="hp">Протокол · адрес</span><span>${esc(S.targets[target].label)}</span>` +
    `<span class="mh">${Object.values(S.targets).map(t => `<span>${esc(t.label)}</span>`).join('')}</span><span class="hs">Последние проверки</span>`;
  if (lh._html !== lhHtml) { lh.innerHTML = lhHtml; lh._html = lhHtml; }
  // keep cell elements alive between refreshes so hover zoom doesn't restart every second
  const grid = $('#grid'), keep = new Set();
  nodes.forEach((n, i) => {
    const r = res[n.id];
    const minis = Object.keys(S.targets).map(k => {
      const rr = S.results[k][n.id];
      return `<div class="mini ${grade(k, rr)} ${k === target ? 'sel' : ''}">${miniVal(k, rr)}</div>`;
    }).join('');
    let el = cells.get(n.id);
    if (!el) { el = document.createElement('div'); el.dataset.id = n.id; cells.set(n.id, el); }
    keep.add(n.id);
    const cls = `cell ${grade(target, r)}`, tip = title(n);
    if (el.className !== cls) el.className = cls;
    if (el.title !== tip) el.title = tip;
    const html = `<button class="hist" data-name="${esc(n.name)}" title="История проверок">⏱</button>
      <button class="star ${watched.has(n.name) ? 'on' : ''}" data-name="${esc(n.name)}" title="Фоновая проверка">${watched.has(n.name) ? '★' : '☆'}</button>
      <div class="name">${nameHtml(n.name)}</div>
      <div class="proto"><span class="p">${esc(n.protocol)}</span> · ${esc(n.network)} · ${esc(n.security)} · ${esc(n.address)}</div>
      ${mainVal(target, r)}
      <div class="minis">${minis}</div>
      ${strip(S.recent?.[n.name]?.[target])}`;
    if (el._html !== html) { el.innerHTML = html; el._html = html; }
    if (grid.children[i] !== el) grid.insertBefore(el, grid.children[i] || null);
  });
  for (const [id, el] of cells) if (!keep.has(id)) { el.remove(); cells.delete(id); }

  const all = Object.values(res), done = all.filter(r => r.state === 'done');
  const ok = done.filter(r => r.ok).length;
  $('#summary').innerHTML = `Серверов: <b>${S.nodes.length}</b> · ${esc(S.targets[target].label)}: <b style="color:var(--good)">${ok}</b> ок / <b style="color:var(--bad)">${done.length - ok}</b> недоступно` +
    (S.active ? ` · в работе: <b style="color:var(--accent-t)">${S.active}</b>` : '') + ` · таймаут ${S.timeout}s`;
  const wi = $('#watchInfo');
  if (!S.watch_interval) wi.textContent = '';
  else {
    const next = S.watch_last_run ? new Date((S.watch_last_run + S.watch_interval) * 1000) : null;
    wi.innerHTML = `★ фон: <b>${nw}</b> раз в ${S.watch_interval / 3600} ч` +
      (S.watch_last_run ? ` · последняя ${new Date(S.watch_last_run * 1000).toLocaleString()} · следующая ${next.toLocaleString()}` : '');
  }
  const err = $('#err');
  err.style.display = S.load_error ? 'block' : 'none';
  err.textContent = S.load_error ? 'Ошибка загрузки подписки: ' + S.load_error : '';
}

async function refresh() {
  try { S = await (await fetch('/api/state')).json(); render(); } catch (e) {}
}
async function check(targets, ids) {
  await fetch('/api/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ targets, ids }) });
  refresh();
}

const themeBtn = $('#theme');
const setTheme = t => {
  if (t === 'light') document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme;
  themeBtn.textContent = t === 'light' ? '☾' : '☀';
  try { localStorage.setItem('theme', t); } catch (e) {}
};
setTheme(document.documentElement.dataset.theme === 'light' ? 'light' : 'dark');
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
$('#view').onclick = e => { const v = e.target.dataset.v; if (v) { view = v; localStorage.setItem('view', v); render(); } };
$('#fStatus').onclick = e => { const b = e.target.closest('button'); if (b) { status = b.dataset.s; localStorage.setItem('status', status); render(); } };
$('#tabs').onclick = e => { const k = e.target.dataset.k; if (k) { target = k; localStorage.setItem('target', k); render(); } };
$('#grid').onclick = async e => {
  const h = e.target.closest('.hist');
  if (h) return openHistory(h.dataset.name);
  const st = e.target.closest('.star');
  if (st) {
    await fetch('/api/watch', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: st.dataset.name, on: !st.classList.contains('on') }) });
    return refresh();
  }
  const c = e.target.closest('.cell'); if (c) check([target], [+c.dataset.id]); };
$('#runSel').onclick = () => check([target]);
$('#runAll').onclick = () => check(Object.keys(S.targets));
$('#reload').onclick = async e => {
  e.target.disabled = true; e.target.textContent = 'Загрузка…';
  await fetch('/api/reload', { method: 'POST' });
  e.target.disabled = false; e.target.textContent = 'Обновить подписку'; refresh();
};
$('#report').onclick = () => {
  if (!S) return;
  const res = S.results[target] || {};
  const failed = S.nodes.filter(n => { const r = res[n.id]; return r && r.state === 'done' && !r.ok; });
  $('#reportTitle').textContent = `${S.targets[target].label}: недоступно ${failed.length}`;
  $('#reportText').value = failed.map(n => n.name).join('\n');
  $('#reportCopy').textContent = 'Копировать';
  $('#reportSave').hidden = $('#mdType').hidden = true;
  $('#reportDlg').showModal();
};
// Telegram parses **bold** and `code` when the text is pasted into the message box; tables aren't supported, so one line per server
$('#exportMd').onclick = () => {
  if (!S) return;
  mdType = status === 'ok' || status === 'bad' ? status : '';
  renderMd();
  $('#reportCopy').textContent = 'Копировать';
  $('#reportSave').hidden = $('#mdType').hidden = false;
  $('#reportDlg').showModal();
};
$('#mdType').onclick = e => { const b = e.target.closest('button'); if (b) { mdType = b.dataset.t; renderMd(); $('#reportCopy').textContent = 'Копировать'; } };
function renderMd() {
  const res = S.results[target] || {};
  const icon = { ok: '✅', bad: '❌', none: '⏳' };
  // drop backticks and collapse **, __, ~~ so server names can't toggle formatting
  const md = s => String(s ?? '').replace(/`/g, "'").replace(/([*_~|])\1+/g, '$1');
  const keys = Object.keys(S.targets);
  const vals = n => keys.map(k => `${S.targets[k].label} ${S.results[k][n.id] ? miniVal(k, S.results[k][n.id]) : '—'}`).join(' · ');
  const cnt = { ok: 0, bad: 0, none: 0 };
  shown.forEach(n => cnt[nodeStatus(res[n.id])]++);
  const list = mdType ? shown.filter(n => nodeStatus(res[n.id]) === mdType) : shown;
  const head = mdType === 'ok' ? `✅ Рабочие: **${cnt.ok}** из ${shown.length}` : mdType === 'bad' ? `❌ Нерабочие: **${cnt.bad}** из ${shown.length}`
    : `✅ ${cnt.ok} · ❌ ${cnt.bad}` + (cnt.none ? ` · ⏳ ${cnt.none}` : '');
  const lines = [
    `**Xray Checker** · ${new Date().toLocaleString()}`,
    `Цель: **${md(S.targets[target].label)}** · ${head}`,
    '',
    ...list.map(n => {
      const r = res[n.id], st = nodeStatus(r);
      const main = st === 'bad' ? md(r.error || 'ошибка') : st === 'ok' ? (S.targets[target].kind === 'download' ? `${r.mbps} Mbit/s` : fmt(r.ms)) : 'не проверен';
      return `${icon[st]} **${md(n.name)}** — ${main}\n    \`${n.protocol} · ${vals(n)}\``;
    }),
  ];
  const text = lines.join('\n');
  $('#mdType').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === mdType));
  $('#reportTitle').textContent = `Markdown · серверов: ${list.length} · символов: ${text.length}` + (text.length > 4096 ? ' (Telegram разобьёт на несколько сообщений)' : '');
  $('#reportText').value = text;
}
$('#reportSave').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([$('#reportText').value], { type: 'text/markdown' }));
  a.download = `xray-${target}-${{ ok: 'ok-', bad: 'failed-' }[mdType] || ''}${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
};
$('#reportCopy').onclick = async e => {
  const t = $('#reportText');
  try { await navigator.clipboard.writeText(t.value); } catch { t.select(); document.execCommand('copy'); }
  e.target.textContent = 'Скопировано';
};
$('#histClose').onclick = () => $('#histDlg').close();
['#histTarget', '#histDays'].forEach(s => $(s).onchange = loadHistory);
$('#reportClose').onclick = () => $('#reportDlg').close();
$('#fProto').onclick = e => { const b = e.target.closest('button'); if (b) { proto = b.dataset.p; localStorage.setItem('proto', proto); render(); } };
$('#fWatched').onclick = () => { onlyW = !onlyW; localStorage.setItem('onlyW', onlyW ? '1' : ''); render(); };
$('#sort').onchange = () => { localStorage.setItem('sort', $('#sort').value); render(); };
$('#fText').oninput = render;
$('#fText').onkeydown = e => { if (e.key === 'Escape') { e.target.value = ''; e.target.blur(); render(); } };
$('#fClear').onclick = () => { $('#fText').value = ''; $('#fText').focus(); render(); };
document.addEventListener('click', e => {
  if (!e.target.closest('.freset')) return;
  status = proto = $('#fText').value = ''; onlyW = false;
  ['status', 'proto', 'onlyW'].forEach(k => localStorage.removeItem(k));
  render();
});
document.addEventListener('keydown', e => {
  if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey || e.target.closest('input, textarea, select') || document.querySelector('dialog[open]')) return;
  e.preventDefault(); $('#fText').focus();
});

refresh();
setInterval(refresh, 1000);
</script>
</body>
